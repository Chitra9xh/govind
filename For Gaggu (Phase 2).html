<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>For Gaggu</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
/* PLACEHOLDER FONTS: Gaegu (headlines, buttons), Caveat (letter, Phase 2). */
:root{
  --ink:#4a2b22; --cream:#fff7ec; --peach:#f6c9a6; --cheek:#ffcf70; --blush:#f4a7a7; --tear:#bfe0f2;
  --f-head:'Gaegu','Segoe Print','Comic Sans MS',cursive;
  --f-hand:'Caveat','Segoe Script',cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--peach);color:var(--ink);font-family:var(--f-head);-webkit-tap-highlight-color:transparent;overflow:hidden}
#ambient{position:fixed;inset:-40px;background:center/cover;filter:blur(26px) brightness(.92) saturate(1.1)}
#stage{position:relative;height:100%;width:100%;max-width:520px;margin:0 auto;overflow:hidden;background:var(--cream);isolation:isolate}
@media (min-width:700px){#stage{height:calc(100% - 40px);margin-top:20px;border-radius:30px;border:4px solid var(--ink);box-shadow:0 18px 50px rgba(74,43,34,.35)}}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden}
.bg{position:absolute;inset:0;background:center/cover no-repeat}
.bg.blur{filter:blur(9px) brightness(1.08) saturate(1.05);transform:scale(1.12)}
.inner{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 22px 34px}
.inner.split{justify-content:space-between}
/* sticker lettering: cream fill, brown outline, like the art's own linework */
h1,h2{font-weight:700;color:#fff;margin:0;line-height:1;-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink)}
h1{font-size:clamp(44px,12vw,64px);transform:rotate(-2deg)}
h2{font-size:clamp(36px,10vw,50px);transform:rotate(1.5deg)}
.tag{background:var(--cream);border:3px solid var(--ink);border-radius:22px 26px 20px 28px;padding:14px 20px;font-size:25px;line-height:1.25;max-width:22em;box-shadow:0 5px 0 var(--ink);margin:14px 0 0}
.btn{font-family:var(--f-head);font-weight:700;font-size:28px;color:var(--ink);background:var(--cheek);border:3px solid var(--ink);border-radius:999px;
  min-height:60px;min-width:150px;padding:6px 28px;cursor:pointer;box-shadow:0 5px 0 var(--ink);touch-action:manipulation;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.soft{background:var(--cream)}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.stk{display:block;height:auto;filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(0 7px 7px rgba(74,43,34,.3))}
.bob{animation:bob 3.4s ease-in-out infinite}
@keyframes bob{50%{translate:0 -7px}}
.pop{animation:pop .7s cubic-bezier(.3,1.7,.5,1) both;animation-delay:calc(var(--d,0) * 1ms + 250ms)}
@keyframes pop{from{scale:.4;opacity:0}to{scale:1;opacity:1}}
/* gift picker: three different objects, not a grid */
.gifts{width:100%;display:flex;flex-direction:column;align-items:center;gap:20px;margin-top:14px}
.gift{font-family:var(--f-head);font-weight:700;font-size:28px;color:var(--ink);cursor:pointer;border:0;position:relative;touch-action:manipulation;transition:transform .12s}
.gift:active{transform:scale(.96)!important}
.gift small{display:block;font-weight:400;font-size:20px;margin-top:2px}
.g1{width:260px;min-height:128px;background:var(--cream);border:3px solid var(--ink);border-radius:6px;transform:rotate(-3deg);box-shadow:0 6px 0 var(--ink);padding-top:70px;
  background-image:linear-gradient(to bottom right,transparent calc(50% - 1.5px),var(--ink) 50%,transparent calc(50% + 1.5px)),linear-gradient(to bottom left,transparent calc(50% - 1.5px),var(--ink) 50%,transparent calc(50% + 1.5px));background-size:100% 58%;background-repeat:no-repeat}
.g2{width:178px;height:178px;border-radius:50%;background:var(--tear);border:3px solid var(--ink);transform:rotate(4deg);box-shadow:0 6px 0 var(--ink);overflow:visible}
.g2 img{position:absolute;left:50%;top:-14px;width:120px;translate:-50% 0}
.g2 span{position:absolute;left:0;right:0;bottom:16px}
.g3{width:300px;min-height:100px;background:var(--cheek);border:3px solid var(--ink);transform:rotate(-1.5deg);padding:10px 20px 10px 104px;text-align:left;border-radius:14px 40px 40px 14px;box-shadow:0 6px 0 var(--ink)}
.g3 img{position:absolute;left:8px;bottom:6px;width:86px}
.note{font-size:18px;background:#fff;border:2px dashed var(--ink);border-radius:10px;padding:8px 14px;margin-top:18px;transform:rotate(-1.5deg);max-width:21em}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px}

.topbar{align-self:flex-start;margin:-8px 0 8px}
.btn.small{min-height:52px;min-width:96px;font-size:24px;padding:4px 22px}
.envbtn{background:none;border:0;padding:0;cursor:pointer;display:block;margin:150px auto 0;touch-action:manipulation}
.envbtn svg{width:min(300px,80vw);height:auto;overflow:visible;filter:drop-shadow(0 7px 0 var(--ink))}
.flap{transform-box:fill-box;transform-origin:50% 0;transition:transform .55s ease-in,opacity .3s ease .45s}
.paper{transition:translate .8s ease-out .5s}
.open .flap{transform:scaleY(-1);opacity:0}
.open .paper{translate:0 -95px}
.letter{background:var(--cream);border:3px solid var(--ink);border-radius:18px 26px 20px 24px;box-shadow:0 7px 0 var(--ink);padding:26px 24px 20px;margin-top:22px;text-align:left;font-family:var(--f-hand);font-weight:500;font-size:clamp(23px,6vw,28px);line-height:1.4;width:100%;max-width:440px;animation:unfold .8s cubic-bezier(.3,1.3,.5,1) both}
.letter p{margin:0 0 .75em;animation:up .7s ease both;animation-delay:calc(var(--i) * 500ms + 500ms)}
.letter .sign{font-weight:700;margin:1em 0 0;text-align:right}
@keyframes unfold{from{scale:.5;translate:0 120px;opacity:0}to{scale:1;translate:0 0;opacity:1}}
@keyframes up{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}
.frame{border:3px solid var(--ink);border-radius:26px;box-shadow:0 7px 0 var(--ink);overflow:hidden;margin-top:22px;width:min(380px,86%);background:#fdf6f2;transform:rotate(-1.5deg)}
.frame img{display:block;width:100%;height:auto}
/* transitions */
.page.t-iris{animation:iris .85s cubic-bezier(.6,0,.2,1) both;z-index:2}
@keyframes iris{from{clip-path:circle(0 at var(--x) var(--y))}to{clip-path:circle(160% at var(--x) var(--y))}}
.page.t-drop{animation:drop .8s cubic-bezier(.3,1.35,.5,1) both;z-index:2}
@keyframes drop{from{translate:0 -105%;rotate:-4deg}to{translate:0 0;rotate:0deg}}
.page.t-rise{animation:rise .75s cubic-bezier(.3,1.3,.5,1) both;z-index:2}
@keyframes rise{from{translate:0 105%}to{translate:0 0}}
.page.t-back{animation:back .6s cubic-bezier(.5,0,.2,1) both;z-index:2}
@keyframes back{from{translate:-100% 0}to{translate:0 0}}
.page.o-shake{animation:shake .5s ease both}
@keyframes shake{20%{translate:-10px 0}40%{translate:9px 0}60%{translate:-6px 0}80%{translate:4px 0}}
.page.o-push{animation:push .6s cubic-bezier(.5,0,.2,1) both}
@keyframes push{to{translate:30% 0;opacity:.4}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.page.out{display:none}}
</style>
</head>

document.getElementById('ambient').style.backgroundImage = `url(${IMG.alley})`;
const stk = (k, w, extra='', alt='Bubu and Dudu sticker') => `<img class="stk ${extra}" src="${IMG[k]}" width="${w}" alt="${alt}">`;
const bg = (k, blur) => `<div class="bg ${blur?'blur':''}" style="background-image:url(${IMG[k]});${k==='alley'?'background-position:62% 0':''}"></div>`;

const pages = {
  '/': () => `${bg('alley')}<div class="inner split">
    <div><h1 class="pop" style="--d:0">Happy birthday, ${NAME}!</h1></div>
    <div><p class="tag pop" style="--d:500">I made you something. Will you accept the gift?</p>
    <div class="row pop" style="--d:700"><button class="btn" data-go="/pick">Yes</button><button class="btn soft" data-go="/no">No</button></div></div></div>`,
  '/no': () => `${bg('street',1)}<div class="inner">
    <h2 class="pop">Wait. Really?</h2>
    <div style="display:flex;align-items:flex-end;margin-top:18px">
      <div class="pop" style="--d:200;rotate:-4deg;margin-right:-14px">${stk('dudu_cry',170,'bob','Dudu crying')}</div>
      <div class="pop" style="--d:350;rotate:4deg">${stk('bubu_cry',170,'bob','Bubu crying')}</div></div>
    <p class="tag pop" style="--d:600">I made this by hand. Bubu and Dudu are already crying.</p>
    <div class="row pop" style="--d:750"><button class="btn" data-go="/pick">Fine, I'll take it</button></div></div>`,
  '/pick': () => `${bg('room',1)}<div class="inner">
    <div class="topbar"><button class="btn soft small" data-go="/">Back</button></div>
    <div class="pop" style="--d:0">${stk('party',210,'bob','Bubu and Dudu with a gift box')}</div>
    <h2 class="pop" style="--d:150;margin-top:14px">Pick one, ${NAME}</h2>
    <div class="gifts">
      <button class="gift g1 pop" style="--d:300" data-go="/gift1">A letter<small>open the envelope</small></button>
      <button class="gift g2 pop" style="--d:450" data-go="/gift2">${stk('hug',120,'','')}<span>A hug</span></button>
      <button class="gift g3 pop" style="--d:600" data-go="/gift3">${stk('slipper',86,'','')}Time pe aaja<small>cute fights</small></button>
    </div></div>`,
  '/gift1': () => letterPage(),
  '/gift2': () => hugPage(),
  '/gift3': () => ph('Time pe aaja', 'Phase 3', 'fight', 260, 'Drag mechanic comes in Phase 3.')
};
function ph(t, phase, k, w, note){
  return `${bg('room',1)}<div class="inner"><h2 class="pop">${t}</h2>
  <div class="pop" style="--d:200;margin-top:22px">${stk(k,w,'bob')}</div>
  <p class="note pop" style="--d:400">Placeholder, built in ${phase}. ${note}</p>
  <div class="row pop" style="--d:500"><button class="btn soft" data-go="/pick">Back to gifts</button></div></div>`;
}

/* Gift 1: the letter. Edit the text here. Put your name in FROM. */
const FROM = '';
const LETTER = [
  'Dear Gaggu,',
  'Happy birthday.',
  'I wanted to give you something that was not bought. So I made this, a little at a time, with a lot of help from Bubu and Dudu.',
  'Thank you for making ordinary days feel softer. Thank you for laughing at my jokes, even the bad ones. Thank you for the small fights too, the \u201Ctime pe aaja\u201D ones, which somehow always end with us laughing.',
  'I hope this year is gentle with you. I hope you get every good thing you have been quietly hoping for, and I hope I get to be there for a lot of it.',
  'Whatever happens, I am on your side. Always.',
  'Happy birthday, Gaggu.'
];
function letterPage(){
  const env = `<svg viewBox="0 0 300 200" aria-hidden="true">
    <rect x="2" y="2" width="296" height="196" rx="8" fill="#f6c9a6" stroke="#4a2b22" stroke-width="3"/>
    <g class="paper"><rect x="28" y="20" width="244" height="170" rx="4" fill="#fff7ec" stroke="#4a2b22" stroke-width="3"/><path d="M52 52h196M52 76h196M52 100h140" stroke="#bfe0f2" stroke-width="3" stroke-linecap="round"/></g>
    <path d="M2 198V60l148 70 148-70v138z" fill="#ffd9b8" stroke="#4a2b22" stroke-width="3" stroke-linejoin="round"/>
    <g class="flap"><path d="M2 2l148 128L298 2z" fill="#f0b98d" stroke="#4a2b22" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="150" cy="110" r="15" fill="#e0705f" stroke="#4a2b22" stroke-width="3"/></g></svg>`;
  const paras = LETTER.map((l,i) => `<p style="--i:${i}">${l}</p>`).join('') + `<p class="sign" style="--i:${LETTER.length}">Yours${FROM ? ',<br>' + FROM : ''}</p>`;
  return `${bg('room',1)}<div class="inner"><h2 class="pop">A letter</h2>
    <div id="envWrap" class="pop" style="--d:200;text-align:center"><button class="envbtn" data-open aria-label="Open the envelope">${env}</button>
    <p class="tag" style="margin-top:26px">Tap the envelope</p></div>
    <article class="letter" hidden>${paras}</article>
    <div class="row"><button class="btn soft" data-go="/pick">Back to gifts</button></div></div>`;
}
function hugPage(){
  return `${bg('room',1)}<div class="inner"><h2 class="pop">A hug</h2>
    <div class="frame pop" style="--d:200"><img src="${IMG.hugAnim}" alt="Two bears hugging" width="380"></div>
    <p class="tag pop" style="--d:450">Here is a hug, until I can give you the real one.</p>
    <div class="row pop" style="--d:600"><button class="btn soft" data-go="/pick">Back to gifts</button></div></div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-open]');
  if(!b || b.classList.contains('open')) return;
  b.classList.add('open');
  const wrap = document.getElementById('envWrap'), letter = document.querySelector('.letter');
  setTimeout(() => { wrap.style.display = 'none'; letter.hidden = false; }, reduce ? 0 : 1700);
});

/* Router with a different transition per move */
const stage = document.getElementById('stage');
let current = null, prev = null, pt = null;
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
function route(){
  const path = location.hash.replace(/^#/, '') || '/';
  const el = document.createElement('section');
  el.className = 'page';
  el.innerHTML = (pages[path] || pages['/'])();
  if(current && !reduce){
    const old = current, r = stage.getBoundingClientRect();
    const x = (pt ? pt.x - r.left : r.width/2) + 'px', y = (pt ? pt.y - r.top : r.height/2) + 'px';
    el.style.setProperty('--x', x); el.style.setProperty('--y', y);
    let t = 't-iris', o = '';
    if(path === '/no'){ t = 't-drop'; o = 'o-shake'; }
    else if(prev === '/no' && path === '/pick'){ t = 't-rise'; }
    else if((path === '/pick' && prev && prev.startsWith('/gift')) || (path === '/' && prev === '/pick')){ t = 't-back'; o = 'o-push'; }
    el.classList.add(t); old.classList.add('out'); if(o) old.classList.add(o);
    setTimeout(() => old.remove(), 900);
  } else if(current){ current.remove(); }
  stage.appendChild(el);
  current = el; prev = path; pt = null;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-go]');
  if(!b) return;
  const r = b.getBoundingClientRect(); pt = {x: r.left + r.width/2, y: r.top + r.height/2};
  location.hash = b.dataset.go;
});
window.addEventListener('hashchange', route);
route();
</script>
